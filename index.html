<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital Mystery Room</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="home-page">


    <div class="home-container">


        <!-- Detective Icon -->
        <div class="detective-icon">
            🕵️
        </div>


        <!-- Main Heading -->
        <h1>
            DIGITAL MYSTERY ROOM
        </h1>


        <!-- Description -->
        <p>
            Can you solve the mystery before time runs out?
        </p>


        <!-- Buttons -->
        <div class="home-buttons">


            <!-- How To Play -->
            <a
                href="how-to-play.html"
                class="btn"
            >
                📖 How to Play
            </a>


            <!-- Start Mystery -->
            <button
                onclick="startGame()"
                class="btn start-btn"
            >
                ▶ Start Mystery
            </button>


            <!-- Leaderboard -->
            <a
                href="leaderboard.html"
                class="btn"
            >
                🏆 Leaderboard
            </a>


        </div>


        <!-- Story -->
        <p class="story">

            🔒 You are trapped inside a mysterious laboratory.

            Find the clues, solve the puzzles and escape!

        </p>


    </div>



    <!-- ================================= -->
    <!-- BACKEND CONNECTION -->
    <!-- ================================= -->

    <script>


        // Render backend URL
        const API_URL =
            "https://digital-mystery-room.onrender.com";



        // =================================
        // START GAME
        // =================================

        async function startGame() {


            // Ask player name
            let name =
                prompt("Enter your name:");



            // Check player name
            if (
                !name ||
                name.trim() === ""
            ) {

                alert(
                    "Please enter your name!"
                );

                return;

            }



            // Remove extra spaces
            name =
                name.trim();



            try {


                console.log(
                    "🌐 Connecting to backend..."
                );


                console.log(
                    "API:",
                    `${API_URL}/api/player`
                );



                // Send player name
                // to Render backend
                const response =
                    await fetch(

                        `${API_URL}/api/player`,

                        {

                            method: "POST",


                            headers: {

                                "Content-Type":
                                    "application/json"

                            },


                            body:
                                JSON.stringify({

                                    name: name

                                })

                        }

                    );



                // Show response status
                console.log(
                    "📡 Response Status:",
                    response.status
                );



                // Check server response
                if (!response.ok) {

                    throw new Error(
                        `Server returned ${response.status}`
                    );

                }



                // Convert response to JSON
                const data =
                    await response.json();



                console.log(
                    "📥 Backend Response:",
                    data
                );



                // =================================
                // PLAYER CREATED
                // =================================

                if (data.success) {


                    console.log(
                        "✅ Player created successfully!"
                    );



                    // Save player ID
                    localStorage.setItem(
                        "playerId",
                        data.player_id
                    );



                    // Save player name
                    localStorage.setItem(
                        "playerName",
                        data.name
                    );



                    console.log(
                        "👤 Player ID:",
                        data.player_id
                    );



                    console.log(
                        "👤 Player Name:",
                        data.name
                    );



                    // Open game page
                    window.location.href =
                        "game.html";


                }


                // =================================
                // BACKEND ERROR
                // =================================

                else {


                    alert(

                        data.message ||
                        "Failed to create player."

                    );

                }


            }



            // =================================
            // CONNECTION ERROR
            // =================================

            catch (error) {


                console.error(
                    "❌ Backend Connection Error:",
                    error
                );



                alert(

                    "Backend connection failed.\n\n" +
                    error.message

                );

            }

        }


    </script>


</body>

</html>
